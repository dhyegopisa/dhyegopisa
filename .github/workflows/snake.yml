name: Cobrinha de contribuições
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-cobrinha
  cancel-in-progress: false

jobs:
  animar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar animações
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagens
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: snake
          publish_dir: ./dist
