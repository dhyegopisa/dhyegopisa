<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galáxia | Dhyego</title>
<style>
html,body{margin:0;overflow:hidden;background:#02040c}canvas{display:block;width:100vw;height:100dvh;touch-action:none;background:radial-gradient(ellipse at 64% 35%,#111329,transparent 55%),radial-gradient(ellipse at 20% 76%,#08172a,transparent 48%),#02040c}
</style>
<canvas aria-label="Galáxia em espiral. Mova o cursor ou arraste o dedo para inclinar a galáxia. Toque para pulsar."></canvas>
<script>
const sky = document.querySelector('canvas');
const ctx = sky.getContext('2d');
const disk = document.createElement('canvas');
disk.width = disk.height = 1600;
const dust = disk.getContext('2d');
const random = Math.random;
function scatter(){return random()+random()+random()-1.5}
function glow(context,x,y,r,color,alpha){
  const light=context.createRadialGradient(x,y,0,x,y,r);
  light.addColorStop(0,'rgba('+color+','+alpha+')');
  light.addColorStop(.35,'rgba('+color+','+alpha*.42+')');
  light.addColorStop(1,'rgba('+color+',0)');
  context.fillStyle=light;
  context.fillRect(x-r,y-r,2*r,2*r);
}
dust.translate(800,800);
dust.globalCompositeOperation='lighter';
// Render the dense dust disk once, then project it with the camera each frame.
for(let i=0;i<55000;i++){
  const radius=730*Math.pow(random(),.79);
  const arm=i%3;
  const angle=arm*2*Math.PI/3 + 3.7*Math.log(1+radius/110) + scatter()*(.23+.55*Math.exp(-radius/140)) + .09*Math.sin(radius/37+arm);
  const x=radius*Math.cos(angle)+scatter()*19;
  const y=radius*Math.sin(angle)+scatter()*19;
  const color=radius<140?'255,179,116':arm===1?'205,134,206':random()<.42?'127,203,238':'149,144,242';
  const fade=Math.min(1,(750-radius)/180);
  if(i<4200) glow(dust,x,y,8+random()*52,color,.024*fade);
  else {
    dust.fillStyle='rgba('+color+','+(.12+random()*.7)*fade+')';
    const size=.45+Math.pow(random(),6)*2.5;
    dust.fillRect(x,y,size,size);
  }
}
for(const [radius,alpha] of [[190,.45],[76,.73],[28,.96],[11,1]]) glow(dust,0,0,radius,'255,207,159',alpha);
const stars=Array.from({length:720},()=>({x:random(),y:random(),depth:random(),phase:random()*6.28}));
let width,height,scale,aimX=0,aimY=0,panX=0,panY=0,pulse=-10000;
const calm=matchMedia('(prefers-reduced-motion: reduce)');
function resize(){
  width=sky.clientWidth;height=sky.clientHeight;
  scale=Math.min(devicePixelRatio,1.6);
  sky.width=Math.round(width*scale);sky.height=Math.round(height*scale);
}
function aim(event){aimX=event.clientX/width*2-1;aimY=event.clientY/height*2-1}
sky.onpointermove=aim;
sky.onpointerdown=event=>{aim(event);pulse=performance.now()};
sky.onpointerleave=()=>{aimX=aimY=0};
function frame(now){
  panX+=(aimX-panX)*.065;panY+=(aimY-panY)*.065;
  const time=calm.matches?0:now/1000;
  ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,width,height);
  for(const star of stars){
    const x=star.x*(width+54)-27+panX*star.depth*21;
    const y=star.y*(height+54)-27+panY*star.depth*21;
    ctx.globalAlpha=.22+star.depth*.54+.12*Math.sin(time*.7+star.phase);
    ctx.fillStyle=star.phase<2?'#ffcaa0':'#c8dcff';
    const size=.45+star.depth*1.3;
    ctx.fillRect(x,y,size,size);
    if(star.depth>.985){glow(ctx,x,y,9,'150,200,255',.35);ctx.fillRect(x-4,y,9,.6);ctx.fillRect(x,y-4,.6,9)}
  }
  ctx.globalAlpha=1;
  const age=(now-pulse)/1000;
  const surge=calm.matches?0:Math.exp(-3*age);
  const diameter=Math.min(width*1.23,height*1.74)*(1+surge*.085);
  ctx.save();ctx.translate(width*.5+panX*14,height*.51+panY*12);
  ctx.rotate(-.37+panX*.14);ctx.scale(1,.53+panY*.13);
  ctx.rotate(time*.019+panX*.16);ctx.drawImage(disk,-diameter/2,-diameter/2,diameter,diameter);
  if(age<1.6&&!calm.matches){
    ctx.strokeStyle='rgba(189,215,255,'+Math.pow(1-age/1.6,2)*.5+')';ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(0,0,diameter*(.012+age*.31),0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();requestAnimationFrame(frame);
}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script></html>
