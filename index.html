<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f4"><title>Pixels interativos | Dhyego</title>
<style>
:root{color-scheme:light;--ink:#151816;--muted:#657069;--green:#07832c}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100svh;overflow:hidden;background:#f5f7f4;background-image:linear-gradient(rgba(30,65,42,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(30,65,42,.045) 1px,transparent 1px);background-size:12px 12px}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.corner{position:fixed;width:20px;height:20px;display:grid;grid-template-columns:repeat(2,10px);grid-template-rows:repeat(2,10px);z-index:1}.corner i:nth-child(1){background:#a7efc4}.corner i:nth-child(2){background:#8de3ad}.corner i:nth-child(3){background:#b8f0ce}.corner i:nth-child(4){background:#07832c}.tl{top:18px;left:18px}.tr{top:18px;right:18px;transform:rotate(180deg)}main{position:relative;z-index:2;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 20px;text-align:center;pointer-events:none}.content{max-width:760px;transform:translateY(-2vh)}h1{font-weight:520;letter-spacing:-.045em;font-size:clamp(2.15rem,6vw,4rem);line-height:1.08;margin:0 0 20px}p{color:var(--muted);font-size:clamp(1rem,2.2vw,1.25rem);line-height:1.55;max-width:610px;margin:0 auto 28px}.buttons{display:flex;gap:12px;justify-content:center;pointer-events:auto}button,.link{font-family:inherit;font-size:15px;border-radius:7px;padding:13px 22px;text-decoration:none;transition:transform .18s,box-shadow .18s,background .18s}button{font-weight:600;border:0;cursor:pointer}button:hover,.link:hover{transform:translateY(-2px);box-shadow:0 7px 18px #163b2422}.primary{color:white;background:var(--green)}.primary:hover{background:#066d25}.secondary,.link{color:#202622;background:#e8ece8;border:1px solid #d8ded9}.link{font-weight:550}.hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#758079;font-size:13px;white-space:nowrap;z-index:2}.toast{position:fixed;left:50%;bottom:55px;transform:translate(-50%,12px);opacity:0;transition:.25s;background:#18211b;color:white;border-radius:8px;padding:10px 15px;font-size:13px;z-index:3;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:480px){.buttons{flex-direction:column;max-width:230px;margin:auto}.hint{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<div class="corner tl" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="corner tr" aria-hidden="true"><i></i><i></i><i></i><i></i></div><canvas id="field" aria-hidden="true"></canvas>
<main><section class="content"><h1>Os pixels seguem<br>o seu cursor</h1><p>Mova o mouse pela tela e veja as cores se espalharem. Clique para criar uma onda de quadradinhos.</p><div class="buttons"><button class="primary" id="start">Criar uma onda</button><button class="secondary" id="more">Saiba mais</button><a class="link" href="https://github.com/dhyegopisa">Meu GitHub</a></div></section></main><div class="hint">Mova o cursor · clique para criar uma explosão de pixels</div><div class="toast" id="toast" role="status">Cada clique cria uma nova onda de cores ✨</div>
<script>
(()=>{const c=document.querySelector("#field"),x=c.getContext("2d"),colors=["#07832c","#39b86a","#a7efc4","#79c9f4","#b99aff","#f2a23a"];let w,h,d,ps=[],m={x:-1000,y:-1000},last=0;function size(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}function add(a,b,n,burst){for(let i=0;i<n;i++){let t=Math.random()*6.283,v=burst?1.2+Math.random()*4:.35+Math.random()*1.35;ps.push({x:a,y:b,vx:Math.cos(t)*v,vy:Math.sin(t)*v,l:1,s:5+Math.random()*7,col:colors[Math.floor(Math.random()*colors.length)],r:Math.random()*3,spin:(Math.random()-.5)*.16})}}addEventListener("resize",size);size();addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY;if(performance.now()-last>18){add(m.x,m.y,2,false);last=performance.now()}});addEventListener("pointerdown",e=>{m.x=e.clientX;m.y=e.clientY;add(m.x,m.y,30,true)});function draw(){x.clearRect(0,0,w,h);ps=ps.filter(p=>p.l>.035);for(const p of ps){let a=m.x-p.x,b=m.y-p.y,z=Math.hypot(a,b);if(z<125&&z>2){p.vx+=a/z*.055;p.vy+=b/z*.055}p.vx*=.975;p.vy*=.975;p.x+=p.vx;p.y+=p.vy;p.l*=.984;p.r+=p.spin;x.save();x.globalAlpha=Math.min(1,p.l*1.7);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.restore()}requestAnimationFrame(draw)}draw();let toast=document.querySelector("#toast"),timer;document.querySelector("#more").onclick=()=>{toast.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove("show"),2200)};document.querySelector("#start").onclick=()=>add(w/2,h/2,70,true)})();
</script></body></html>
